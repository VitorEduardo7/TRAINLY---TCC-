<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainly - Mapa</title>
    <!-- CSS Organizado nas pastas -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/mapa.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="dashboard.html" class="brand-logo">Train<span>ly</span></a>
                <ul class="nav-links">
                    <li><a href="dashboard.html">Painel</a></li>
                    <li><a href="mapa.html" class="active">Mapa</a></li>
                    <li><a href="#">Amizades</a></li>
                </ul>
            </div>
            <div class="nav-right">
                <button class="icon-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>
                <a href="perfil.html" class="user-avatar-small"><span>M</span></a>
            </div>
        </div>
    </nav>

    <div class="map-layout">
        <!-- Painel Lateral de Controle (Nova Estrutura) -->
        <aside class="workout-sidebar card">
            <div class="workout-header">
                <h1>Gravar Atividade</h1>
                <p>GPS Pronto</p>
            </div>

            <!-- Métricas em tempo real -->
            <div class="metrics-grid">
                <div class="metric-box full-width">
                    <span>Distância Percorrida</span>
                    <strong id="distance">0.00 km</strong>
                </div>
                <div class="metric-box">
                    <span>Tempo</span>
                    <strong id="timer">00:00</strong>
                </div>
                <div class="metric-box">
                    <span>Ritmo Médio</span>
                    <strong id="pace">0'00"</strong>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="workout-controls">
                <button class="btn-start-run" id="startBtn" onclick="toggleWorkout()">Iniciar</button>
                <button class="btn-pause-run" id="pauseBtn" onclick="toggleWorkout()" style="display: none;">Finalizar</button>
            </div>
        </aside>

        <!-- Container do Mapa Original (Iframe mantido) -->
        <main class="map-frame-wrapper">
            <iframe 
                src="https://www.openstreetmap.org/export/embed.html?bbox=-46.7001%2C-23.6000%2C-46.6001%2C-23.5000&amp;layer=mapnik" 
                scrolling="no">
            </iframe>
        </main>
    </div>

    <!-- Script simplificado apenas para o cronômetro visual -->
    <script>
        let isRunning = false;
        let seconds = 0;
        let timerInterval;

        function toggleWorkout() {
            isRunning = !isRunning;
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');

            if (isRunning) {
                startBtn.style.display = 'none';
                pauseBtn.style.display = 'block';
                
                timerInterval = setInterval(() => {
                    seconds++;
                    let mins = Math.floor(seconds / 60);
                    let secs = seconds % 60;
                    document.getElementById('timer').innerText = 
                        String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                    
                    let dist = (seconds * 0.003).toFixed(2);
                    document.getElementById('distance').innerText = dist + ' km';
                    document.getElementById('pace').innerText = '4\'55"';
                }, 1000);
            } else {
                clearInterval(timerInterval);
                alert('Atividade gravada com sucesso!');
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
